<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EMORA — Birthday Experience</title>
<meta name="theme-color" content="#08050a">
<style>
:root{--bg:#07050a;--text:#fff9fd;--muted:#c9b8c7;--pink:#ff77b4;--rose:#ff4f96;--vio:#9d7cff;--gold:#ffd79b;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;background:#060408;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;height:100%}
body{background:radial-gradient(900px 650px at 15% 0,rgba(255,81,155,.16),transparent 55%),radial-gradient(800px 650px at 100% 10%,rgba(121,93,255,.14),transparent 55%),#060408}
#app{height:100dvh;position:relative;overflow:hidden}.grain{position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:60;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E")}
.top{position:fixed;left:0;right:0;top:0;height:68px;z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(180deg,rgba(6,4,8,.78),transparent)}
.brand{font-size:12px;font-weight:950;letter-spacing:.24em}.progress{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.progress b{display:block;height:100%;width:12%;background:linear-gradient(90deg,var(--rose),var(--vio),var(--gold));transition:width .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 16px rgba(255,113,180,.8)}
.sound{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;backdrop-filter:blur(14px)}
.scene{position:absolute;inset:0;display:grid;place-items:center;padding:86px 20px 36px;opacity:0;pointer-events:none;filter:blur(12px);transform:scale(1.025);transition:.75s ease}
.scene.active{opacity:1;pointer-events:auto;filter:none;transform:scale(1)}
.content{width:min(760px,100%);text-align:center;position:relative;z-index:10}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#f1a1c5;margin-bottom:12px;font-weight:900}
h1,h2,p{margin-top:0}h1{font-size:clamp(44px,9vw,84px);line-height:.94;letter-spacing:-.055em;margin-bottom:18px}h2{font-size:clamp(34px,7vw,58px);line-height:1;letter-spacing:-.045em;margin-bottom:16px}.lead{font-size:clamp(17px,2.7vw,22px);line-height:1.62;color:var(--muted);max-width:680px;margin:0 auto 26px}
.glow{background:linear-gradient(90deg,#fff,#ff9cca,#c9b8ff,#fff);background-size:220% auto;-webkit-background-clip:text;color:transparent;animation:shine 5s linear infinite}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:999px;padding:14px 20px;font-weight:850;backdrop-filter:blur(14px);box-shadow:0 16px 38px rgba(0,0,0,.22);transition:.2s}.btn:active{transform:scale(.97)}.primary{border:0;background:linear-gradient(90deg,#ff67aa,#8f77ff)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choiceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.choice{font-size:26px;padding:18px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff}
.orb{position:absolute;border-radius:50%;filter:blur(18px);opacity:.62;animation:float 6s ease-in-out infinite}.o1{width:190px;height:190px;background:#ff4d9a;left:4%;top:15%}.o2{width:160px;height:160px;background:#7f69ff;right:2%;top:30%;animation-delay:-2s}.o3{width:130px;height:130px;background:#ffc58c;left:38%;bottom:5%;animation-delay:-4s}
.stars i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 12px #fff;animation:tw 2.2s infinite}.hearts span{position:absolute;bottom:-40px;color:#ff94c4;font-size:18px;animation:rise 7s linear infinite;opacity:.78}.rings i{position:absolute;width:240px;height:240px;border:1px solid rgba(255,255,255,.12);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:ring 4s ease-out infinite}.rings i:nth-child(2){animation-delay:1.3s}.rings i:nth-child(3){animation-delay:2.6s}
.glass{border:1px solid var(--line);background:rgba(255,255,255,.07);backdrop-filter:blur(18px);border-radius:26px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.memories{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.memory{min-height:180px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));position:relative;overflow:hidden}.memory .front,.memory .back{position:absolute;inset:0;display:grid;place-items:center;padding:16px;transition:.6s}.memory .front{font-weight:900}.memory .back{opacity:0;transform:scale(.9);background:linear-gradient(145deg,rgba(255,104,172,.18),rgba(125,105,255,.18))}.memory.open .front{opacity:0;transform:scale(1.1)}.memory.open .back{opacity:1;transform:scale(1)}
.photo{width:min(520px,86vw);aspect-ratio:4/5;border-radius:34px;overflow:hidden;margin:0 auto 20px;border:1px solid var(--line);position:relative;box-shadow:0 35px 90px rgba(0,0,0,.45);background:linear-gradient(145deg,#542544,#262154)}
.photoArt{position:absolute;inset:0;background:radial-gradient(circle at 36% 30%,rgba(255,229,241,.9),transparent 9%),radial-gradient(circle at 67% 38%,rgba(255,168,211,.65),transparent 14%),linear-gradient(140deg,#5b2f50,#2c255f 55%,#15141f);filter:blur(22px) saturate(.7);transform:scale(1.12);transition:2s ease}.photo.reveal .photoArt{filter:none;transform:scale(1)}.scan{position:absolute;left:0;right:0;height:2px;background:white;box-shadow:0 0 20px #fff;animation:scan 3s ease-in-out infinite}
.wave{display:flex;align-items:center;gap:3px;height:34px}.wave i{width:3px;background:linear-gradient(#fff,#ff8dbf);border-radius:99px;animation:wave 1s ease-in-out infinite}.voice{display:flex;align-items:center;gap:12px;max-width:520px;margin:18px auto}.play{width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#150d16;font-weight:900}
.runaway{position:relative;transition:.18s}.fake{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#918292}.glitch{animation:glitch 1.1s steps(2,end) infinite}.bigheart{font-size:88px;animation:beat 1.4s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,87,158,.55))}
.confetti i{position:absolute;top:-30px;width:8px;height:14px;border-radius:2px;animation:fall 4.5s linear infinite}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.56);backdrop-filter:blur(14px);z-index:100;display:grid;place-items:end center;opacity:0;pointer-events:none;transition:.4s}.modal.open{opacity:1;pointer-events:auto}.panel{width:min(560px,100%);background:#100d14;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:24px}.reacts{display:flex;gap:8px}.reacts button{flex:1;padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:24px}.reacts .selected{background:rgba(255,111,177,.18);border-color:#ff79b4}.panel textarea{width:100%;min-height:90px;margin:12px 0;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;padding:14px}
@keyframes shine{to{background-position:220% center}}@keyframes float{50%{transform:translateY(24px) scale(1.08)}}@keyframes tw{50%{opacity:.12;transform:scale(.4)}}@keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0}20%{opacity:.8}100%{transform:translateY(-110vh) scale(1.4);opacity:0}}@keyframes ring{0%{transform:translate(-50%,-50%) scale(.55);opacity:.65}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}@keyframes scan{50%{top:90%}}@keyframes wave{50%{height:7px;opacity:.45}}@keyframes glitch{20%{text-shadow:3px 0 #ff4f94,-3px 0 #6f7cff}40%{transform:translateX(-2px)}60%{transform:translateX(2px)}}@keyframes beat{50%{transform:scale(1.08)}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:720px){.choiceGrid{grid-template-columns:repeat(2,1fr)}.memories{grid-template-columns:1fr}.memory{min-height:132px}.scene{padding:78px 18px 28px}}
</style>
</head>
<body>
<div id="app">
<div class="grain"></div>
<div class="top"><div class="brand">EMORA</div><div class="progress"><b id="bar"></b></div><button class="sound" id="sound">♫</button></div>
<main id="stage"></main>
<div class="modal" id="modal"><div class="panel"><div class="eyebrow">REACTION</div><h2>Qanday his qilding?</h2><div class="reacts"><button>🥹</button><button>❤️</button><button>😍</button><button>😭</button><button>😂</button></div><textarea placeholder="Xohlasang, javob yoz..."></textarea><button class="btn primary" id="send">Yuborish</button></div></div>
</div>
<script>
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),modal=document.getElementById('modal');let n=0;
const stars=()=>'<div class="stars">'+Array.from({length:36},(_,i)=>'<i style="left:'+((i*29)%98)+'%;top:'+((i*47)%92)+'%;animation-delay:-'+(i*.11)+'s"></i>').join('')+'</div>';
const hearts=()=>'<div class="hearts">'+Array.from({length:18},(_,i)=>'<span style="left:'+((i*17)%100)+'%;animation-delay:-'+(i*.32)+'s">♥</span>').join('')+'</div>';
const rings=()=>'<div class="rings"><i></i><i></i><i></i></div>';
const confetti=()=>'<div class="confetti">'+Array.from({length:44},(_,i)=>'<i style="left:'+((i*23)%100)+'%;background:'+(i%3===0?'#ff6faa':i%3===1?'#9b86ff':'#ffd18f')+';animation-delay:-'+(i*.1)+'s"></i>').join('')+'</div>';
const scenes=[
()=>'<section class="scene active">'+stars()+'<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="content"><div class="eyebrow">faqat sen uchun</div><h1 class="glow">Bu oddiy tabrik emas.</h1><p class="lead">Bugun shoshilmaymiz. Har bir sahna sen uchun yozilgan.</p><button class="btn primary" data-next>Boshlash</button></div></section>',
()=>'<section class="scene">'+hearts()+rings()+'<div class="content"><div class="eyebrow">mood check</div><h2>Bugungi kayfiyating qanday?</h2><p class="lead">Bitta emoji tanla. Sayt ham seni “tushunib” olsin 😌</p><div class="choiceGrid"><button class="choice mood">🥹</button><button class="choice mood">😌</button><button class="choice mood">😍</button><button class="choice mood">😂</button></div><p id="moodText" class="lead" style="margin-top:18px;min-height:34px"></p></div></section>',
()=>'<section class="scene">'+stars()+'<div class="content"><div class="eyebrow">little test</div><h2>Meni sog‘indingmi?</h2><p class="lead">To‘g‘ri javobni topish qiyin emas 😏</p><div class="actions"><button class="btn primary" data-next>Ha ❤️</button><button class="btn runaway" id="no">Yo‘q 🙃</button></div><p id="hint" class="lead" style="margin-top:18px"></p></div></section>',
()=>'<section class="scene">'+hearts()+'<div class="content"><div class="eyebrow">memory box</div><h2>Senga aytmoqchi bo‘lgan 3 narsa bor.</h2><p class="lead">Hammasini ochsanggina keyingi surprise chiqadi.</p><div class="memories"><div class="memory"><div class="front">01 · Senda yoqadigan narsa</div><div class="back">Tabassuming. Ayniqsa o‘zing bilmay kulib yuborgan payting.</div></div><div class="memory"><div class="front">02 · Bir xotira</div><div class="back">Oddiy kun edi, lekin men uchun esda qolib ketdi.</div></div><div class="memory"><div class="front">03 · Aytilmagan gap</div><div class="back">Sening borliging ba’zi kunlarni yaxshiroq qiladi.</div></div></div><div style="margin-top:18px"><button class="btn primary" id="memNext" disabled>Hammasini och</button></div></div></section>',
()=>'<section class="scene">'+stars()+'<div class="content"><div class="eyebrow">memory found</div><h2>Bir rasm topildi.</h2><p class="lead">Lekin birdan ko‘rsatmaymiz. 2 soniya ushlab tur.</p><div class="photo" id="photo"><div class="photoArt"></div><div class="scan"></div></div><button class="btn" id="hold">Hold to reveal</button></div></section>',
()=>'<section class="scene">'+rings()+'<div class="content"><div class="eyebrow">one more thing</div><h2>Ba’zi gaplar yozilgandan ko‘ra, eshitilgani yaxshi.</h2><div class="glass voice"><button class="play" id="play">▶</button><div class="wave">'+Array.from({length:28},(_,i)=>'<i style="height:'+(8+(i*7)%26)+'px;animation-delay:-'+(i*.05)+'s"></i>').join('')+'</div><span>0:17</span></div><p class="lead">Bu yerda creatorning haqiqiy voice note’i bo‘ladi.</p><button class="btn primary" data-next>Davom etish</button></div></section>',
()=>'<section class="scene">'+stars()+'<div class="content"><div class="fake">the end</div><h2>Happy Birthday ❤️</h2><p class="lead">Hammasi shu edi…</p><button class="btn" data-next>Yopish</button></div></section>',
()=>'<section class="scene">'+stars()+'<div class="content"><div class="eyebrow glitch">signal interrupted</div><h2 class="glitch">Yo‘q. Hali emas.</h2><p class="lead">Bitta yashirin scene qolib ketibdi.</p><button class="btn primary" data-next>Ochish</button></div></section>',
()=>'<section class="scene">'+hearts()+confetti()+'<div class="content"><div class="bigheart">♥</div><div class="eyebrow">final message</div><h2 class="glow">Bugun hamma seni tabriklaydi.</h2><p class="lead">Men esa senga shuni eslatmoqchi edim: sen kim uchundir juda muhim odamsan. Eng yaxshi xotiralaring hali oldinda.</p><button class="btn primary" id="react">Reaction qoldir</button></div></section>'
];
function render(){stage.innerHTML=scenes.map(f=>f()).join('');[...stage.querySelectorAll('.scene')].forEach((s,i)=>s.classList.toggle('active',i===n));bar.style.width=((n+1)/scenes.length*100)+'%';bind()}
function next(){const all=[...stage.querySelectorAll('.scene')];all[n].classList.remove('active');n=Math.min(n+1,all.length-1);all[n].classList.add('active');bar.style.width=((n+1)/scenes.length*100)+'%';bind()}
function bind(){
stage.querySelectorAll('[data-next]').forEach(b=>b.onclick=next);
stage.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{document.getElementById('moodText').textContent={ '🥹':'Bunaqa ko‘z bilan qarama… hozir yanayam hissiyotli bo‘ladi 🥹','😌':'Yaxshi. Hozir bundan ham yaxshiroq qilamiz.','😍':'Demak vibe joyida ❤️','😂':'Zo‘r. Keyin kulgidan boshqa narsa ham bo‘ladi.'}[b.textContent];setTimeout(next,900)});
const no=document.getElementById('no'),hint=document.getElementById('hint');if(no){let t=0;const run=()=>{t++;no.style.transform='translate('+(Math.random()*150-75)+'px,'+(Math.random()*110-55)+'px) rotate('+(Math.random()*10-5)+'deg)';hint.textContent=t===1?'Yo‘q tugmasi biroz uyatchan ekan 😌':t===2?'Baribir bosolmaysan 😏':'Internet emas. Tugmaning o‘zi qochyapti 😂'};no.onmouseenter=run;no.onclick=run}
const ms=[...stage.querySelectorAll('.memory')],mn=document.getElementById('memNext');if(ms.length){ms.forEach(m=>m.onclick=()=>{m.classList.add('open');if(ms.every(x=>x.classList.contains('open'))){mn.disabled=false;mn.textContent='Keyingi surprise'}});mn.onclick=next}
const hold=document.getElementById('hold'),photo=document.getElementById('photo');if(hold){let timer;const start=()=>timer=setTimeout(()=>{photo.classList.add('reveal');hold.textContent='Revealed ✨';setTimeout(next,900)},2000);hold.onpointerdown=start;hold.onpointerup=()=>clearTimeout(timer);hold.onpointerleave=()=>clearTimeout(timer)}
const play=document.getElementById('play');if(play)play.onclick=()=>play.textContent=play.textContent==='▶'?'Ⅱ':'▶';
const react=document.getElementById('react');if(react)react.onclick=()=>modal.classList.add('open')
}
document.querySelectorAll('.reacts button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.reacts button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('send').onclick=()=>modal.classList.remove('open');
let ctx;document.getElementById('sound').onclick=async()=>{const b=document.getElementById('sound');if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();const g=ctx.createGain();g.gain.value=.012;g.connect(ctx.destination);[220,329.63,440].forEach((f,i)=>{const o=ctx.createOscillator();const gg=ctx.createGain();o.frequency.value=f;o.type='sine';gg.gain.value=[.5,.22,.12][i];o.connect(gg);gg.connect(g);o.start()});b.textContent='❚❚'}else if(ctx.state==='running'){await ctx.suspend();b.textContent='♫'}else{await ctx.resume();b.textContent='❚❚'}};
render();
</script>
</body>
</html>
